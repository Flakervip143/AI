name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_IN: ${{ secrets.KEY_ALIAS }}
          KEY_PW_IN: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/featurestic.jks"
            echo "FEAT_KEYSTORE_PASSWORD=$KEYSTORE_PW" >> "$GITHUB_ENV"
            echo "FEAT_KEY_ALIAS=$KEY_ALIAS_IN" >> "$GITHUB_ENV"
            echo "FEAT_KEY_PASSWORD=$KEY_PW_IN" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/featurestic.jks" \
              -alias ci -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass ci-android-sign -keypass ci-android-sign \
              -dname "CN=AI Build, OU=CI, O=AI, L=NA, ST=NA, C=IN"
            echo "FEAT_KEYSTORE_PASSWORD=ci-android-sign" >> "$GITHUB_ENV"
            echo "FEAT_KEY_ALIAS=ci" >> "$GITHUB_ENV"
            echo "FEAT_KEY_PASSWORD=ci-android-sign" >> "$GITHUB_ENV"
          fi

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/featurestic.jks
          KEYSTORE_PASSWORD: ${{ env.FEAT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ env.FEAT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.FEAT_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: featurestic-ai-terminal-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Prepare update metadata
        run: |
          VC=$(grep -oP 'versionCode \K[0-9]+' app/build.gradle)
          VN=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          cp app/build/outputs/apk/release/app-release.apk ./app-release.apk
          SHA=$(sha256sum ./app-release.apk | cut -d' ' -f1)
          printf '{"versionCode":%s,"versionName":"%s","sha256":"%s"}' "$VC" "$VN" "$SHA" > version.json
          echo "version.json ->" && cat version.json

      - name: Publish rolling "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ci-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create ci-latest ./app-release.apk ./version.json \
            --title "Latest build ($(date -u +%Y-%m-%d))" \
            --notes "Auto-build from ${{ github.sha }}" \
            --latest
